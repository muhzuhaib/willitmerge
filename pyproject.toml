[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "willitmerge"
version = "0.1.0"
description = "Check whether a GitHub repository actually merges pull requests from people outside the team"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Muhammad Zuhaib Zahid" }]
keywords = ["github", "open-source", "pull-requests", "contributing", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
# No runtime dependencies on purpose. This is a command a person installs to
# answer one question, and every dependency is a reason for that install to
# fail on someone's machine. certifi is used if it is already present.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/muhzuhaib/willitmerge"
Issues = "https://github.com/muhzuhaib/willitmerge/issues"
Changelog = "https://github.com/muhzuhaib/willitmerge/blob/main/CHANGELOG.md"

[project.scripts]
willitmerge = "willitmerge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/willitmerge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
